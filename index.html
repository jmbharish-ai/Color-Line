<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Color Line</title>
        <style>
            body{
                background-color: white;
                text-align: center;
            }
            input{
                width: 200px; height: 50px;
                background-color: white; color: black;
                text-align: center; font-size: 45px; font-family: Arial, Helvetica, sans-serif;
                border: 5px solid black; border-radius: 0px;
            }
            label{
                width: 800px; height: 70px;
                background-color: white; color: black;
                border: 2px solid black; border-radius: 0px;

                display: block;
                margin: 10px;
            }
            button{
                width: 500px; height: 50px;
                background-color: white; color: black;
                text-align: center; font-size: 30px; font-family: Arial, Helvetica, sans-serif;
                border: 5px solid black; border-radius: 0px;
            }
        </style>
    </head>
    <body>
        <button onclick="createLine()">Create Line</button><br><br>
        <input id="redGreen" type="range" min="0" max="1" value="0">
        <input id="blueYellow" type="range" min="0" max="1" value="0"><br>
        <input id="upLuminance" type="text" style="background-color: yellow;">
        <input id="upRedGreen" type="text">
        <input id="upBlueYellow" type="text">
        <div id="line"></div>
        <input id="downLuminance" type="text" style="background-color: yellow;">
        <input id="downRedGreen" type="text">
        <input id="downBlueYellow" type="text">

        <script>
            const line=document.getElementById("line");
            const divisions=18;

            for(var i=0; i<=divisions; i++){
                var color=document.createElement("label");
                line.appendChild(color);
                color.id=String(i);
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
